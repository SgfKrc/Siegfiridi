[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siegfridi"
version = "0.1.0"
description = "A Python-first, style-focused MIDI arrange workstation."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6>=6.8",
    "mido>=1.3,<2",
    "python-rtmidi>=1.5,<2",
]

[project.optional-dependencies]
audio = [
    "av>=14",
    "librosa>=0.10,<1",
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "soundfile>=0.12,<1",
]
transcription = [
    "basic-pitch>=0.4,<1",
    "onnxruntime>=1.18,<2",
]
synthesis = [
    "pyfluidsynth>=1.3,<2",
]
dev = [
    "pyinstaller>=6,<7",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]
all = [
    "av>=14",
    "librosa>=0.10,<1",
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "soundfile>=0.12,<1",
    "basic-pitch>=0.4,<1",
    "onnxruntime>=1.18,<2",
    "pyfluidsynth>=1.3,<2",
    "pyinstaller>=6,<7",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[project.scripts]
siegfridi = "siegfridi.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
